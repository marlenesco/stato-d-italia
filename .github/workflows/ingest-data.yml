name: Ingest fast official data

on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: Reprocess unchanged source assets
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.ref_name == 'diag-bigbang-user-agent' && 'stato-d-italia-diagnostic-bigbang-user-agent' || 'stato-d-italia-r2-publish' }}
  cancel-in-progress: false

jobs:
  ingest-data:
    if: github.ref_name != 'diag-bigbang-user-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      FOREST_PROCESSING_MODE: statistical-api
    steps:
      - uses: actions/checkout@v7
      - name: Validate R2 configuration
        run: |
          test -n "$R2_ACCESS_KEY_ID" || { echo "::error::Missing R2_ACCESS_KEY_ID secret"; exit 1; }
          test -n "$R2_SECRET_ACCESS_KEY" || { echo "::error::Missing R2_SECRET_ACCESS_KEY secret"; exit 1; }
          test -n "$R2_ENDPOINT" || { echo "::error::Missing R2_ENDPOINT secret"; exit 1; }
          test -n "$R2_BUCKET" || { echo "::error::Missing R2_BUCKET secret"; exit 1; }
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync --all-groups --frozen
      - run: uv run pytest -q
      - name: Restore verified BIGBANG raw cache
        uses: actions/cache@v6.1.0
        with:
          path: data/raw/ispra-bigbang-10
          key: bigbang-raw-${{ runner.os }}-${{ hashFiles('config/sources/ispra-bigbang.yaml') }}
      - name: Restore reusable geospatial canonical cache
        uses: actions/cache@v6.1.0
        with:
          path: data/canonical/forests/algorithm_version=forests-zonal-statistics-v2
          key: forests-canonical-${{ runner.os }}-${{ github.run_id }}
          restore-keys: forests-canonical-${{ runner.os }}-
      - id: preflight
        name: GET-check persisted data source state
        run: |
          uv run stato-data check-sources --scope data --publish r2 --report reports/data-source-check.json
          echo "changed=$(jq -r .changed reports/data-source-check.json)" >> "$GITHUB_OUTPUT"
      - name: Ingest changed data sources atomically
        if: steps.preflight.outputs.changed == 'true' || inputs.force
        run: >-
          uv run stato-data run --publish r2 --scope data
          --plan reports/data-source-check.json
          ${{ inputs.force && '--force' || '' }}
  diagnostic-bigbang-user-agent:
    if: github.ref_name == 'diag-bigbang-user-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report hosted runner context
        shell: bash
        run: |
          echo "RUNNER_OS=${RUNNER_OS}"
          echo "RUNNER_ARCH=${RUNNER_ARCH}"
          echo "RUNNER_NAME=${RUNNER_NAME}"
          echo "RUNNER_ENVIRONMENT=${RUNNER_ENVIRONMENT}"
          echo "RUNNER_REGION=${RUNNER_REGION:-unavailable}"
      - name: Test A - stato-italia-data user agent
        shell: bash
        run: |
          set +e
          url='https://groupware.sinanet.isprambiente.it/bigbang-data/library/bigbang100/ascii_grid/actual_evapotranspiration/ae_annual_1951-2025/download/en/1/AE_ANNUAL_1951-2025.zip'
          user_agent='stato-italia-data/0.1'
          echo "USER_AGENT=${user_agent}"
          curl -L \
            --connect-timeout 20 \
            --max-time 60 \
            --range 0-1023 \
            -A "${user_agent}" \
            -D - \
            -o /dev/null \
            -sS \
            -w '\nHTTP=%{http_code}\nREMOTE_IP=%{remote_ip}\nCONTENT_TYPE=%{content_type}\nSIZE_DOWNLOAD=%{size_download}\nTIME_CONNECT=%{time_connect}\nTIME_STARTTRANSFER=%{time_starttransfer}\n' \
            "${url}"
          curl_exit=$?
          echo "CURL_EXIT=${curl_exit}"
          exit 0
      - name: Test B - browser-like user agent
        shell: bash
        run: |
          set +e
          url='https://groupware.sinanet.isprambiente.it/bigbang-data/library/bigbang100/ascii_grid/actual_evapotranspiration/ae_annual_1951-2025/download/en/1/AE_ANNUAL_1951-2025.zip'
          user_agent='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36'
          echo "USER_AGENT=${user_agent}"
          curl -L \
            --connect-timeout 20 \
            --max-time 60 \
            --range 0-1023 \
            -A "${user_agent}" \
            -D - \
            -o /dev/null \
            -sS \
            -w '\nHTTP=%{http_code}\nREMOTE_IP=%{remote_ip}\nCONTENT_TYPE=%{content_type}\nSIZE_DOWNLOAD=%{size_download}\nTIME_CONNECT=%{time_connect}\nTIME_STARTTRANSFER=%{time_starttransfer}\n' \
            "${url}"
          curl_exit=$?
          echo "CURL_EXIT=${curl_exit}"
          exit 0
