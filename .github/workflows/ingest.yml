name: Ingest official data

on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: Reprocess unchanged source assets
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ingest:
    if: ${{ secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' && secrets.R2_ENDPOINT != '' && secrets.R2_BUCKET != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-groups --frozen
      - run: uv run pytest -q
      - run: >-
          uv run stato-data run --publish r2
          ${{ inputs.force && '--force' || '' }}
