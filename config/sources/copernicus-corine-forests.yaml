catalog_api_url: https://land.copernicus.eu/api/@get-download-file-urls
license: Copernicus full, free and open access; attribution and explicit derived-product notice required
geographical_granularity: raster; Stato d'Italia derives ISTAT municipality, province, region and country values
temporal_granularity: six-yearly status layers
methodology_url: https://land.copernicus.eu/en/products/corine-land-cover/clc2018?tag=2018
bearer_token_environment: CLMS_API_TOKEN
raw_retention_environment: FORESTS_RAW_RETENTION
raw_retention_default: retain
known_limitations:
  - CORINE is a distinct 100 m land-cover inventory. It is not continuous with HRL Tree Cover & Forests.
  - Forest classes use CLC codes 311, 312 and 313; Minimum Mapping Unit is 25 ha.
